name: Feature request
description: A step of the workflow that score-to-song could make easier.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you were trying to make, and where the current commands get in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What you would like the toolkit to do. Remember that the mix stage stays linear (gains, delays, fades).
