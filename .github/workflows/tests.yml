name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    # The unit tests need no model and no GPU: score writing, ABC round trip, mixing arithmetic, guards.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[test]'
      - run: pytest -q
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.14.0
      - run: ruff check src tests
      - run: shellcheck scripts/install.sh examples/*/run.sh
