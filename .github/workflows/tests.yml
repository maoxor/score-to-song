name: tests
on:
  push:
  pull_request:
jobs:
  unit:
    # The unit tests need no model and no GPU: score writing, ABC round trip, mixing arithmetic.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[test]'
      - run: pytest -q
