# Continuation score: everything of main.toml unchanged, then a bridge and an ending.
# `score-to-song continue` keeps the main render up to --keep-s and YuE2 sings the rest of this score,
# so the voice keeps its timbre (a fresh render of a longer score would not sing the opening the same way).
id = "first_song_long"

[extend]
from = "main.toml"

[[sections]]
name = "bridge"
chords = ["Dm", "Am", "E", "E"]
melody = "D5:8 F5:8 | E5:12 C5:4 | B4:8 G#4:8 | B4:12 r:4"
lyrics = ["Oh ah", "Ah ah"]

[[sections]]
name = "outro"
chords = ["F", "G", "Am", "Am"]
melody = "A4:4 C5:4 F5:8 | E5:8 D5:8 | C5:8 B4:4 A4:4~ | A4:16"
lyrics = ["Ah ah eh ah"]
pattern = "drone"
