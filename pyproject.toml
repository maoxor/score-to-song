[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "score-to-song"
dynamic = ["version"]
description = "Write a melody as a score, have YuE2 sing it locally on Apple Silicon, extend it by continuation, layer voices and mix with linear gains, with full provenance."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "the score-to-song authors" }]
keywords = ["music generation", "singing", "YuE", "MLX", "Apple Silicon", "ABC notation", "vocals"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Multimedia :: Sound/Audio :: Mixers",
]
dependencies = ["numpy>=1.26", "soundfile>=0.12", "pyloudnorm>=0.1.1"]

[project.urls]
Homepage = "https://github.com/maoxor/score-to-song"
Documentation = "https://github.com/maoxor/score-to-song/tree/main/docs"
Issues = "https://github.com/maoxor/score-to-song/issues"
Changelog = "https://github.com/maoxor/score-to-song/blob/main/CHANGELOG.md"

[project.optional-dependencies]
separation = ["audio-separator>=0.30"]
test = ["pytest>=8"]
dev = ["pytest>=8", "ruff==0.14.0"]

[project.scripts]
score-to-song = "score_to_song.cli:main"

[tool.hatch.version]
path = "src/score_to_song/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/score_to_song"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
